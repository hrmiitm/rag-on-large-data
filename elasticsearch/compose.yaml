name: sec-rag-elasticsearch
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6@sha256:79b4f1de4c15e6eca824723086a51e5934406d614d410cc11be77748cafac537
    container_name: sec-rag-elasticsearch
    ports:
      - "127.0.0.1:19200:9200"
    environment:
      discovery.type: single-node
      cluster.name: sec-rag-benchmark
      node.name: sec-rag-local
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ingest.geoip.downloader.enabled: "false"
      ES_JAVA_OPTS: -Xms2g -Xmx2g -XX:ActiveProcessorCount=4
    mem_limit: 4g
    memswap_limit: 4g
    cpus: 4
    volumes:
      - ./db/es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20

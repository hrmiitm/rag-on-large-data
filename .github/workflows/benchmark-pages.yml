name: Publish SEC RAG benchmark
on:
  push:
    paths:
      - 'judge/final-results/**'
      - 'judge/evaluation.schema.json'
      - 'data/questions.jsonl'
      - 'website/**'
      - '.github/workflows/benchmark-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sec-rag-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # Deploy the repository's actual default branch, without assuming main/master.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:ui
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build versioned data and static site
        run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
